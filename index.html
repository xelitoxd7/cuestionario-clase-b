<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cuestionario Clase B</title>

    <link rel="stylesheet" href="estilos.css">

    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; max-width: 800px; margin: auto; padding-top: 60px; }
        .pregunta { margin-bottom: 25px; border: 1px solid #ccc; padding: 15px; border-radius: 8px; background: #f9f9f9; }
        .aviso { font-weight: bold; color: #d35400; font-size: 0.9em; }
        
        #btn-config { position: fixed; top: 15px; right: 15px; z-index: 1001; background: #333; color: white; border: none; padding: 10px 15px; border-radius: 50%; font-size: 20px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.3); transition: 0.3s; }
        #btn-config:hover { background: #555; }

        #selector-container { display: none; position: fixed; top: 65px; right: 15px; z-index: 1000; background: #fff; padding: 15px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); text-align: center; }
        #selector-container select { margin-top: 10px; padding: 5px; width: 100%; font-size: 16px; }

        button.btn-accion { background-color: #4CAF50; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; margin-top: 10px; font-size: 16px; }
        #menu { text-align: center; margin-top: 50px; padding: 20px; background: #f4f4f4; border-radius: 8px; }
        .feedback { font-size: 1.2em; font-weight: bold; margin-top: 10px; display: block; }
    </style>
</head>
<body>

    <button id="btn-config" onclick="toggleConfig()">⚙️</button>

    <div id="selector-container">
        <label for="cantidad"><strong>Preguntas por test:</strong></label>
        <select id="cantidad" onchange="cambiarCantidad()">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="all">Todas</option>
        </select>
    </div>

    <h1>CUESTIONARIO CLASE B</h1>
    
    <div id="menu">
        <button class="btn-accion" onclick="iniciarCuestionario()">Iniciar Cuestionario</button>
    </div>

    <div id="contenedor-preguntas"></div>
    <div id="contenedor-botones-finales"></div>

    <script src="banco.js"></script>

    <script>
        let preguntasActuales = [];

        function toggleConfig() {
            const panel = document.getElementById('selector-container');
            if (panel.style.display === 'none' || panel.style.display === '') {
                panel.style.display = 'block';
            } else {
                panel.style.display = 'none';
            }
        }

        function cambiarCantidad() {
            toggleConfig(); 
            iniciarCuestionario(); 
        }

        function iniciarCuestionario() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('contenedor-botones-finales').innerHTML = '';
            
            // ¡Aquí está la magia! Esto hace que al reiniciar te lleve hasta arriba
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            let cantidad = document.getElementById('cantidad').value;
            preguntasActuales = [...bancoDePreguntas];

            if (cantidad !== 'all') {
                // Mezclar las preguntas aleatoriamente antes de cortarlas (opcional, pero recomendado para estudiar)
                preguntasActuales.sort(() => Math.random() - 0.5);
                preguntasActuales = preguntasActuales.slice(0, parseInt(cantidad));
            }

            let html = "";
            preguntasActuales.forEach((p, index) => {
                let aviso = p.tipo === "una" ? "Marque una opción" : "Marque las opciones correctas";
                html += `<div class="pregunta" id="pregunta-${index}">
                    <p><strong>${index + 1}. ${p.pregunta}</strong> <br><span class="aviso">(${aviso})</span></p>`;
                p.opciones.forEach((op, i) => {
                    html += `<label style="display:block; margin: 8px 0; cursor: pointer;">
                                <input type="${p.tipo === 'una' ? 'radio' : 'checkbox'}" name="p${index}" value="${i}"> ${op}
                             </label>`;
                });
                html += `<span class="feedback" id="feedback-${index}"></span></div>`;
            });
            
            html += `<button type="button" class="btn-accion" id="btn-calificar" onclick="verificar()">Calificar</button>`;
            document.getElementById('contenedor-preguntas').innerHTML = html;
        }

        function verificar() {
            preguntasActuales.forEach((p, index) => {
                const marcadas = Array.from(document.querySelectorAll(`input[name="p${index}"]:checked`)).map(el => parseInt(el.value));
                const feedback = document.getElementById(`feedback-${index}`);
                
                const correcta = p.c.length === marcadas.length && p.c.every(c => marcadas.includes(c));
                
                if (correcta) {
                    feedback.innerHTML = " ✅ Correcto";
                    feedback.style.color = "green";
                } else {
                    feedback.innerHTML = " ❌ Incorrecto";
                    feedback.style.color = "red";
                }
            });
            
            document.getElementById('btn-calificar').style.display = 'none';
            document.getElementById('contenedor-botones-finales').innerHTML = `<button class="btn-accion" onclick="iniciarCuestionario()">Reiniciar Test</button>`;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
