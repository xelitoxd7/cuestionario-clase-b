<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cuestionario Clase B</title>

    <link rel="stylesheet" href="estilos.css">

    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; max-width: 800px; margin: auto; padding-top: 60px; }
        .pregunta { margin-bottom: 25px; border: 1px solid #ccc; padding: 15px; border-radius: 8px; background: #f9f9f9; }
        .aviso { font-weight: bold; color: #d35400; font-size: 0.9em; }
        
        #btn-config { position: fixed; top: 15px; right: 15px; z-index: 1001; background: #333; color: white; border: none; padding: 10px 15px; border-radius: 50%; font-size: 20px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.3); transition: 0.3s; }
        #btn-config:hover { background: #555; }

        #selector-container { display: none; position: fixed; top: 65px; right: 15px; z-index: 1000; background: #fff; padding: 15px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); text-align: center; }
        #selector-container select { margin-top: 10px; padding: 5px; width: 100%; font-size: 16px; }

        button.btn-accion { background-color: #4CAF50; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; margin-top: 10px; font-size: 16px; transition: 0.3s; }
        button.btn-accion:hover { background-color: #45a049; transform: scale(1.05); }
        
        #menu { text-align: center; margin-top: 50px; padding: 20px; background: #f4f4f4; border-radius: 8px; }
        .feedback { font-size: 1.2em; font-weight: bold; margin-top: 10px; display: block; }

        /* --- ESTILOS DE LA NUEVA PANTALLA DE SELECCIÓN Y ANIMACIÓN --- */
        #pantalla-seleccion {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            z-index: 2000; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            
            transform-origin: calc(100% - 35px) 35px; 
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
            opacity: 1;
            transform: scale(1);
        }

        #pantalla-seleccion h2 { font-size: 24px; color: #333; margin-bottom: 30px; }

        .cuadricula-opciones {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .btn-cuadro {
            width: 110px; height: 110px;
            font-size: 28px; font-weight: bold;
            background: #2196F3; color: white;
            border: none; border-radius: 20px;
            cursor: pointer; box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            transition: 0.2s;
        }

        .btn-cuadro:hover { background: #1976D2; transform: translateY(-5px); }
        .btn-cuadro:active { transform: scale(0.95); }

        .minimizando {
            transform: scale(0);
            opacity: 0 !important;
        }
    </style>
</head>
<body>

    <button id="btn-config" onclick="toggleConfig()">⚙️</button>

    <div id="selector-container">
        <label for="cantidad"><strong>Preguntas por test:</strong></label>
        <select id="cantidad" onchange="cambiarCantidadDesdeTuerca()">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="30">30</option>
            <option value="all">Todas</option>
        </select>
    </div>

    <div id="pantalla-seleccion">
        <h2>¿Cuántas preguntas te gustaría responder?</h2>
        <div class="cuadricula-opciones">
            <button class="btn-cuadro" onclick="seleccionarYAnimar(10)">10</button>
            <button class="btn-cuadro" onclick="seleccionarYAnimar(20)">20</button>
            <button class="btn-cuadro" onclick="seleccionarYAnimar(30)">30</button>
            <button class="btn-cuadro" onclick="seleccionarYAnimar('all')" style="font-size: 22px;">Todas</button>
        </div>
    </div>

    <h1>CUESTIONARIO CLASE B</h1>
    
    <div id="menu">
        <button class="btn-accion" onclick="mostrarPantallaSeleccion()">Iniciar Cuestionario</button>
    </div>

    <div id="contenedor-preguntas"></div>
    <div id="contenedor-botones-finales"></div>

    <script src="banco.js"></script>

    <script>
        let preguntasActuales = [];

        function toggleConfig() {
            const panel = document.getElementById('selector-container');
            if (panel.style.display === 'none' || panel.style.display === '') {
                panel.style.display = 'block';
            } else {
                panel.style.display = 'none';
            }
        }

        function cambiarCantidadDesdeTuerca() {
            toggleConfig(); 
            generarCuestionario(); 
        }

        function mostrarPantallaSeleccion() {
            const pantalla = document.getElementById('pantalla-seleccion');
            pantalla.classList.remove('minimizando'); 
            pantalla.style.display = 'flex'; 
        }

        function seleccionarYAnimar(cantidadElegida) {
            document.getElementById('cantidad').value = cantidadElegida;
            
            const pantalla = document.getElementById('pantalla-seleccion');
            pantalla.classList.add('minimizando');
            
            setTimeout(() => {
                pantalla.style.display = 'none';
                generarCuestionario();
            }, 600);
        }

        function generarCuestionario() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('contenedor-botones-finales').innerHTML = '';
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            let cantidad = document.getElementById('cantidad').value;
            preguntasActuales = [...bancoDePreguntas];

            // AQUÍ QUITÉ LA LÍNEA QUE MEZCLABA LAS PREGUNTAS AL AZAR.
            // AHORA SOLO CORTA LA CANTIDAD, PERO MANTIENE EL ORDEN.
            if (cantidad !== 'all') {
                preguntasActuales = preguntasActuales.slice(0, parseInt(cantidad));
            }

            let html = "";
            preguntasActuales.forEach((p, index) => {
                let aviso = p.tipo === "una" ? "Marque una opción" : "Marque las opciones correctas";
                html += `<div class="pregunta" id="pregunta-${index}">
                    <p><strong>${index + 1}. ${p.pregunta}</strong> <br><span class="aviso">(${aviso})</span></p>`;
                p.opciones.forEach((op, i) => {
                    html += `<label style="display:block; margin: 8px 0; cursor: pointer;">
                                <input type="${p.tipo === 'una' ? 'radio' : 'checkbox'}" name="p${index}" value="${i}"> ${op}
                             </label>`;
                });
                html += `<span class="feedback" id="feedback-${index}"></span></div>`;
            });
            
            html += `<button type="button" class="btn-accion" id="btn-calificar" onclick="verificar()">Calificar</button>`;
            document.getElementById('contenedor-preguntas').innerHTML = html;
        }

        function verificar() {
            preguntasActuales.forEach((p, index) => {
                const marcadas = Array.from(document.querySelectorAll(`input[name="p${index}"]:checked`)).map(el => parseInt(el.value));
                const feedback = document.getElementById(`feedback-${index}`);
                
                const correcta = p.c.length === marcadas.length && p.c.every(c => marcadas.includes(c));
                
                if (correcta) {
                    feedback.innerHTML = " ✅ Correcto";
                    feedback.style.color = "green";
                } else {
                    feedback.innerHTML = " ❌ Incorrecto";
                    feedback.style.color = "red";
                }
            });
            
            document.getElementById('btn-calificar').style.display = 'none';
            
            document.getElementById('contenedor-botones-finales').innerHTML = `<button class="btn-accion" onclick="mostrarPantallaSeleccion()">Hacer otro test</button>`;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
